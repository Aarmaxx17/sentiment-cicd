<!DOCTYPE html>

<html>

<head>

<title>AI Sentiment Analyzer</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {

    font-family: Arial, sans-serif;

    background: #0f172a;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

    margin: 0;

}

.container {

    background: #1e293b;

    padding: 40px;

    border-radius: 18px;

    width: 600px;

    box-shadow: 0 10px 40px rgba(0,0,0,.4);

}

h1 {

    text-align: center;

    color: #38bdf8;

}

.subtitle {

    text-align: center;

    color: #94a3b8;

}

textarea {

    width: 100%;

    height: 150px;

    padding: 15px;

    margin-top: 20px;

    border-radius: 10px;

    box-sizing: border-box;

    font-size: 16px;

}

button {

    width: 100%;

    background: #0ea5e9;

    color: white;

    border: none;

    padding: 15px;

    margin-top: 15px;

    border-radius: 10px;

    font-size: 16px;

    cursor: pointer;

}

button:hover {

    background: #0284c7;

}

.result {

    background: #334155;

    padding: 20px;

    border-radius: 10px;

    margin-top: 20px;

}

.positive {

    color: #4ade80;

}

.negative {

    color: #f87171;

}

.neutral {

    color: #facc15;

}

</style>

</head>

<body>

<div class="container">

<h1>AI Sentiment Analyzer</h1>

<p class="subtitle">
AI-powered Natural Language Processing
</p>

<form method="POST">

<textarea
name="text"
placeholder="Enter your text here..."
required>{{ text }}</textarea>

<button type="submit">

Analyze Sentiment

</button>

</form>

{% if result %}

<div class="result">

<h2 class="{{ result.sentiment.lower() }}">

{{ result.sentiment }}

</h2>

<p>

Confidence:
{{ result.confidence }}%

</p>

<p>
Positive Score:
{{ result.scores.pos }}
</p>

<p>
Neutral Score:
{{ result.scores.neu }}
</p>

<p>
Negative Score:
{{ result.scores.neg }}
</p>

</div>

{% endif %}

</div>

</body>

</html>
